<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko Rekomendasi</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e4e7ec;--ac:#ee4d2d;--ac2:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mut:#9aa4b2;--bd:#2c333b;--ac:#ff6a4d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:var(--ac);color:var(--ac2);padding:28px 0 22px}
header h1{margin:0;font-size:1.7rem}header p{margin:6px 0 0;opacity:.92}
input{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:18px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;font:inherit}
.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{margin:0;font-size:1rem}.cat{font-size:.75rem;color:var(--mut)}
.d{font-size:.85rem;color:var(--mut);flex:1}
.pr{font-weight:700;color:var(--ac);font-size:1.05rem}
.btn{display:block;text-align:center;background:var(--ac);color:var(--ac2);padding:10px;border-radius:10px;font-weight:600;text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:50px 0}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px 16px 30px}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="nama"></h1><p id="slogan"></p></div></header>
<div class="wrap">
  <input id="cari" type="search" placeholder="Masukkan kode produk atau nama produk…" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div id="hasil"></div>
</div>
<footer>Sebagai affiliate, kami dapat komisi dari pembelian lewat link di situs ini, tanpa biaya tambahan untuk Anda.</footer>

<script src="produk.js"></script>
<script>
var kategori = "Semua", kata = "";
var $ = function (id) { return document.getElementById(id); };
function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function rupiah(n) { return "Rp" + Number(n || 0).toLocaleString("id-ID"); }
function amanUrl(u) { return /^https?:\/\//i.test(u) ? u : "#"; }

function kartu(p) {
  var gambar = p.foto ? '<img src="' + esc(p.foto) + '" alt="' + esc(p.nama) + '" loading="lazy">' : esc(p.emoji || "🛍️");
  return '<div class="card"><div class="ph">' + gambar + '</div><div class="cb">' +
    '<span class="cat">' + esc(p.kategori) + (p.kode ? " · Kode: <b>" + esc(p.kode) + "</b>" : "") + "</span>" +
    "<h3>" + esc(p.nama) + "</h3>" +
    '<div class="d">' + esc(p.deskripsi) + "</div>" +
    '<div class="pr">' + rupiah(p.harga) + "</div>" +
    '<a class="btn" href="' + esc(amanUrl(p.link)) + '" target="_blank" rel="sponsored noopener noreferrer">Beli Sekarang</a>' +
    "</div></div>";
}

function tampil() {
  var daftarKat = ["Semua"];
  PRODUK.forEach(function (p) { if (p.kategori && daftarKat.indexOf(p.kategori) < 0) daftarKat.push(p.kategori); });
  $("chips").innerHTML = daftarKat.map(function (k) {
    return '<button class="chip' + (k === kategori ? " on" : "") + '" data-k="' + esc(k) + '">' + esc(k) + "</button>";
  }).join("");

  var q = kata.trim().toLowerCase();
  if (TOKO.hanyaTampilJikaKode && !q) {
    $("hasil").innerHTML = '<div class="empty">Masukkan kode produk untuk melihat produk.</div>';
    return;
  }
  var cocok = PRODUK.filter(function (p) {
    var teks = (p.nama + " " + p.deskripsi + " " + (p.kode || "")).toLowerCase();
    return (kategori === "Semua" || p.kategori === kategori) && teks.indexOf(q) >= 0;
  });
  $("hasil").innerHTML = cocok.length
    ? '<div class="grid">' + cocok.map(kartu).join("") + "</div>"
    : '<div class="empty">Produk tidak ditemukan. Periksa kembali kode produk Anda.</div>';
}

document.title = TOKO.nama;
$("nama").textContent = TOKO.nama;
$("slogan").textContent = TOKO.slogan;
$("cari").addEventListener("input", function (e) { kata = e.target.value; tampil(); });
$("chips").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (b) { kategori = b.getAttribute("data-k"); tampil(); }
});
tampil();
</script>
</body>
</html>
